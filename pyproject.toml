[project]
name = "interval-take-home"
version = "0.1.0"
description = "This is the repository for my code implementation of Interval's take home assignment."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
]
[project.scripts]
main = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]
